<!DOCTYPE html>
<!-- Menandakan bahwa dokumen ini menggunakan HTML5 -->

<html lang="en">
<!-- Menentukan bahasa utama halaman -->

<head>
    <!-- Bagian head berisi informasi dan pengaturan halaman -->

    <meta charset="UTF-8">
    <!-- Mengatur karakter agar teks dapat ditampilkan dengan benar -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Membuat tampilan lebih responsif di berbagai ukuran layar -->

    <title>Image & Media</title>
    <!-- Judul halaman yang tampil pada tab browser -->
</head>

<body>
    <!-- Bagian body berisi konten yang ditampilkan pada halaman -->

    <!-- img digunakan untuk menampilkan gambar -->
    <img src="asset/gambar.png" alt="gambar ini hilang">
    <!-- src menentukan lokasi gambar, sedangkan alt menjelaskan gambar -->

    <!-- audio digunakan untuk menampilkan dan memutar file audio -->
    <audio controls>
        <!-- source menentukan lokasi dan tipe file audio -->
        <source src="asset/audio.mp3" type="audio/mpeg">
    </audio>

    <!-- video digunakan untuk menampilkan dan memutar file video -->
    <video controls width="400">
        <!-- controls menampilkan tombol kontrol, width mengatur lebar video -->
        <!-- ini merukan video dari tim joki it -->
        <source src="asset/video.mp4" type="video/mp4">
    </video>

</body>
</html>
