<!DOCTYPE html>
<!-- Menandakan bahwa dokumen ini menggunakan HTML5 -->

<html lang="en">
<!-- Menentukan bahasa utama yang digunakan pada halaman -->

<head>
    <!-- Bagian head berisi pengaturan dan informasi halaman -->

    <meta charset="UTF-8">
    <!-- Mengatur karakter agar teks dapat ditampilkan dengan benar -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Membuat tampilan halaman menyesuaikan ukuran layar perangkat -->

    <title>Belajar Div dan Span</title>
    <!-- Judul halaman yang tampil pada tab browser -->
</head>

<body>
    <!-- Bagian body berisi konten yang ditampilkan pada halaman -->

    <div class="card">
        <!-- div digunakan sebagai container untuk mengelompokkan beberapa elemen -->

        <h2>Produk</h2>
        <!-- Menampilkan judul atau nama produk -->

        <p>
            <!-- p digunakan untuk membuat paragraf informasi -->
            Harga

            <span class="price">Rp50.000</span>
            <!-- span digunakan untuk membungkus bagian kecil dari teks -->
            <!-- class="price" dapat digunakan untuk memberikan style khusus dengan CSS -->
        </p>
    

    </div>

</body>
</html>
