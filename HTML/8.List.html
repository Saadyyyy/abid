<!DOCTYPE html>
<!-- Menandakan bahwa dokumen ini menggunakan HTML5 -->

<html lang="en">
<!-- Menentukan bahasa utama halaman menggunakan bahasa Inggris -->

<head>
    <!-- Bagian head berisi informasi dan pengaturan halaman -->

    <meta charset="UTF-8">
    <!-- Mengatur encoding karakter agar teks dapat menampilkan berbagai karakter -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Membuat tampilan halaman lebih responsif di HP, tablet, dan desktop -->

    <title>List</title>
    <!-- Judul halaman yang akan tampil pada tab browser -->
</head>

<body>
    <!-- Bagian body berisi semua konten yang ditampilkan pada halaman -->

    <!-- Unordered List digunakan untuk membuat daftar tanpa urutan angka -->
    <ul> 
        ini merupakan ul
        <!-- li digunakan untuk membuat setiap item dalam daftar -->
        <li>HTML</li>
        <li>CSS</li>
    </ul>

    <!-- Ordered List digunakan untuk membuat daftar dengan urutan angka -->
    <ol>
        ini merupakan ol
        <!-- Setiap item daftar tetap menggunakan tag li -->
        <li>Buka Editor</li>
        <li>Simpan File</li>
        <li>Simpan File</li>
        <li>Simpan File</li>
        <li>Simpan File</li>
    </ol>

    <!-- Description List digunakan untuk menampilkan istilah dan penjelasannya -->
    <dl>
        <!-- dt digunakan untuk menuliskan istilah atau nama -->
        <dt>HTML</dt>

        <!-- dd digunakan untuk memberikan deskripsi dari istilah di atas -->
        <dd>Bahasa untuk membuat struktur halaman.</dd>
    </dl>

</body>
</html>
