<!-- Menandakan bahwa dokumen ini menggunakan HTML5 -->
<!DOCTYPE html>

<!-- Menentukan bahasa utama halaman -->
<html lang="en">

<head>
    <!-- Bagian pengaturan halaman -->

    <!-- Mengatur karakter agar teks ditampilkan dengan benar -->
    <meta charset="UTF-8">

    <!-- Membuat tampilan menyesuaikan ukuran layar -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Judul yang tampil pada tab browser -->
    <title>Tipe Input</title>
</head>

<body>
    <!-- Bagian body berisi konten yang ditampilkan di halaman -->

    <!-- Judul utama halaman -->
    <h1>Contoh Tipe Input</h1>

    <!-- Label untuk input nama -->
    <label>Nama</label>

    <!-- Input untuk memasukkan teks -->
    <input type="text">

    <br><br>

    <!-- Label untuk input email -->
    <label>Email</label>

    <!-- Input khusus untuk alamat email -->
    <input type="email">

    <br><br>

    <!-- Label untuk input password -->
    <label>Password</label>

    <!-- Input password, karakter yang diketik akan disamarkan -->
    <input type="password">

    <br><br>

    <!-- Label untuk input umur -->
    <label>Umur</label>

    <!-- Input untuk memasukkan angka -->
    <input type="number">

    <br><br>

    <!-- Label untuk input tanggal lahir -->
    <label>Tanggal Lahir</label>

    <!-- Input untuk memilih tanggal -->
    <input type="date">

    <br><br>

    <!-- Checkbox untuk pilihan ya atau tidak -->
    <label>
        <input type="checkbox">
        Setuju dengan ketentuan
    </label>
    <label>
        <input type="checkbox">
        Tidak Setuju dengan ketentuan
    </label>

    <br><br>

    <!-- Label untuk pilihan jenis kelamin -->
    <label>Jenis Kelamin:</label>

    <!-- Radio digunakan untuk memilih satu dari beberapa pilihan -->
    <input type="radio" name="gender"> Laki-laki
    <input type="radio" name="gender"> Perempuan

    <br><br>

    <!-- Input untuk memilih file dari perangkat -->
    <input type="file">

    <br><br>

    <!-- Tombol untuk mengirim form -->
    <input type="submit" value="Kirim">

    <!-- Tombol untuk menghapus atau mengembalikan nilai input -->
    <input type="reset" value="Reset">

</body>
</html>
