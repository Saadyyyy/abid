<!DOCTYPE html>
<!-- Menandakan bahwa dokumen ini menggunakan HTML5 -->

<html lang="en">
<!-- Menentukan bahasa utama halaman -->

<head>
    <!-- Bagian head berisi pengaturan dan informasi halaman -->

    <meta charset="UTF-8">
    <!-- Mengatur karakter agar teks dapat ditampilkan dengan benar -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Membuat tampilan menyesuaikan ukuran layar perangkat -->

    <title>Link</title>
    <!-- Judul halaman yang tampil pada tab browser -->
</head>

<body>
    <!-- Bagian body berisi konten yang ditampilkan di halaman -->

    <h1>Belajar Link</h1>
    <!-- h1 digunakan sebagai judul utama halaman -->

    <a href="https://siporto.com">Buka siporto</a>
    <!-- Link menuju website lain menggunakan alamat URL -->

    <br>
    <!-- Membuat pindah ke baris berikutnya -->

    <a href="2.Heading.html">Ke Halaman About</a>
    <!-- Link menuju halaman lain dalam website -->
    <br>

    <a href="#contact">Ke Bagian Contact</a>
    <!-- Link menuju elemen yang memiliki id="contact" -->
    <br>

    <a href="mailto:hello@example.com">Kirim Email</a>
    <!-- Link untuk membuka aplikasi email dan mengirim email -->

    <h2 id="contact">Contact</h2>
    <!-- Bagian tujuan dari link dengan href="#contact" -->

    <p>Ini adalah bagian contact.</p>
    <!-- Menampilkan informasi pada bagian contact -->

</body>
</html>
