<!DOCTYPE html>
<!-- Menentukan bahwa dokumen ini menggunakan HTML5 -->

<html lang="id">
<!-- Menentukan bahasa utama halaman adalah Bahasa Indonesia -->

<head>
    <!-- Bagian head berisi informasi dan pengaturan halaman -->

    <meta charset="UTF-8">
    <!-- Mengatur encoding karakter agar mendukung berbagai karakter -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Membuat tampilan website lebih responsif di HP, tablet, dan desktop -->

    <title>Belajar HTML SESI 1</title>
    <!-- Menentukan judul halaman yang tampil di tab browser -->
</head>

<body>
    <!-- Bagian body berisi semua konten yang akan ditampilkan di halaman website -->

    <h1>Hello HTML</h1>
    <!-- Heading atau judul utama halaman -->

    <p>Ini halaman pertama saya.</p>
    <!-- Paragraf yang berisi teks -->
</body>

</html>
