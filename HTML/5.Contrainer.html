<!DOCTYPE html>
<!-- Menandakan bahwa dokumen ini menggunakan HTML5 -->

<html lang="id">
<!-- Menentukan bahwa bahasa utama halaman adalah Bahasa Indonesia -->

<head>
    <!-- Bagian head berisi pengaturan dan informasi halaman -->

    <meta charset="UTF-8">
    <!-- Mengatur karakter agar teks dapat ditampilkan dengan benar -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Membuat tampilan halaman menyesuaikan ukuran layar perangkat -->

    <title>Belajar Semantic HTML</title>
    <!-- Judul halaman yang tampil pada tab browser -->
</head>

<body>
    <!-- Bagian body berisi seluruh konten yang tampil di halaman -->

    <header>
        <!-- header digunakan untuk bagian pembuka halaman -->

        <h1>Website Belajar HTML</h1>
        <!-- h1 digunakan sebagai judul utama halaman -->
    </header>

    <nav>
        <!-- nav digunakan untuk menampilkan bagian navigasi -->

        <p>Beranda | Materi | Kontak</p>
    </nav>

    <main>
        <!-- main digunakan untuk membungkus konten utama halaman -->

        <section>
            <!-- section digunakan untuk mengelompokkan konten dengan tema tertentu -->

            <h2>Artikel Terbaru</h2>

            <article>
                <!-- article digunakan untuk konten yang dapat berdiri sendiri -->

                <h3>Belajar HTML</h3>
                <p>HTML digunakan untuk membuat struktur website.</p>
            </article>
        </section>

        <aside>
            <!-- aside digunakan untuk menampilkan konten tambahan -->

            <h3>Informasi Tambahan</h3>
            <p>Materi Web Development untuk pemula.</p>
        </aside>

    </main>

    <footer>
        <!-- footer digunakan sebagai bagian penutup halaman -->

        <p>Copyright 2026 Belajar Web Development</p>
    </footer>

</body>
</html>
