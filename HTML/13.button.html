<!-- Menandakan bahwa dokumen ini menggunakan HTML5 -->
<!DOCTYPE html>

<!-- Menentukan bahasa utama halaman -->
<html lang="en">

<head>
    <!-- Bagian pengaturan dan informasi halaman -->

    <!-- Mengatur karakter agar teks dapat ditampilkan dengan benar -->
    <meta charset="UTF-8">

    <!-- Membuat tampilan menyesuaikan ukuran layar perangkat -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Judul halaman yang tampil pada tab browser -->
    <title>Button</title>
</head>

<body>
    <!-- Bagian body berisi konten yang ditampilkan di halaman -->

    <!-- Button biasa untuk menjalankan suatu aksi -->
    <button type="button">Buka Modal</button>

    <!-- Button submit digunakan untuk mengirim data form -->
    <button type="submit">Simpan</button>

    <!-- Button reset digunakan untuk mengembalikan nilai form -->
    <button type="reset">Reset</button>

</body>
</html>
