<!DOCTYPE html>
<!-- Menandakan bahwa dokumen ini menggunakan HTML5 -->

<html lang="en">
<!-- Menentukan bahasa utama halaman -->

<head>
    <!-- Bagian pengaturan dan informasi halaman -->

    <meta charset="UTF-8">
    <!-- Mengatur encoding karakter -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Membuat tampilan responsif di berbagai perangkat -->

    <title>Table</title>
    <!-- Judul yang tampil pada tab browser -->
</head>

<body>
    <!-- Bagian yang berisi konten halaman -->

    <!-- table digunakan sebagai pembungkus seluruh tabel -->
    <table>

        <!-- caption digunakan untuk memberikan judul atau keterangan tabel -->
        <caption>Daftar Peserta</caption>

        <!-- thead digunakan untuk bagian header tabel -->
        <thead>
            <tr>
                <!-- th digunakan untuk membuat judul kolom -->
                <th>Nama</th>
                <th>Nilai</th>
            </tr>
        </thead>

        <!-- tbody digunakan untuk bagian isi tabel -->
        <tbody>
            <tr>
                <!-- td digunakan untuk menampilkan data dalam tabel -->
                <td>Andi</td>
                <td>90</td>
            </tr>

            <tr>
                <td>Budi</td>
                <td>85</td>
            </tr>
        </tbody>

        <!-- tfoot digunakan untuk bagian footer atau ringkasan tabel -->
        <tfoot>
            <tr>
                <td>Total Peserta</td>
                <td>2</td>
            </tr>
        </tfoot>

    </table>

</body>
